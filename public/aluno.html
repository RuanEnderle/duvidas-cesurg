<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CESURG - Enviar Dúvida</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b6b3a">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dúvidas CESURG">
  <link rel="apple-touch-icon" href="/logo-cesurg.png">
</head>

<body class="pagina-aluno">

  <div class="fundo-decorativo">
    <div class="faixa faixa-verde"></div>
    <div class="faixa faixa-amarela"></div>
    <div class="faixa faixa-vermelha"></div>
  </div>

  <div class="card-principal">
    <div class="topo-app">
      <div class="logo-box">
        <img src="logo-cesurg.png" alt="Logo CESURG" class="logo-cesurg-img">
      </div>

      <div class="subtitulo-topo">
        Canal Privado de Dúvidas
      </div>
    </div>

    <div class="icone-topo">🎓</div>

    <h1>Enviar dúvida</h1>

    <p class="descricao">
      Digite o código informado pelo professor e envie sua dúvida de forma privada.
    </p>

    <label for="codigo">Código da aula:</label>
    <input
      type="text"
      id="codigo"
      placeholder="Digite o código informado pelo professor"
      autocomplete="off"
    >

    <label for="nome">
      Seu nome <span class="texto-opcional">(opcional)</span>:
    </label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome ou deixe em branco"
      autocomplete="off"
    >

    <label for="pergunta">Sua dúvida:</label>
    <textarea
      id="pergunta"
      placeholder="Digite sua dúvida aqui..."
    ></textarea>

    <button onclick="enviarPergunta()" id="botaoEnviar">
      Enviar dúvida
    </button>

    <p id="mensagem" class="mensagem"></p>

    <div class="rodape-ilustrativo">
      <span>📘 Aluno</span>
      <span>🔐 Código da aula</span>
      <span>💬 Dúvida privada</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    let alunoId = localStorage.getItem("alunoIdDuvidasCesurg");

    if (!alunoId) {
      alunoId = "aluno-" + Date.now() + "-" + Math.floor(Math.random() * 100000);
      localStorage.setItem("alunoIdDuvidasCesurg", alunoId);
    }

    const parametros = new URLSearchParams(window.location.search);
    const codigoDoLink = parametros.get("codigo");

    if (codigoDoLink) {
      document.getElementById("codigo").value = codigoDoLink.toUpperCase();
    }

    function enviarPergunta() {
      const codigo = document.getElementById("codigo").value.trim().toUpperCase();
      const nome = document.getElementById("nome").value.trim();
      const pergunta = document.getElementById("pergunta").value.trim();
      const mensagem = document.getElementById("mensagem");

      if (codigo === "") {
        mensagem.innerText = "Digite o código da aula antes de enviar.";
        mensagem.style.color = "#b91c1c";
        return;
      }

      if (pergunta === "") {
        mensagem.innerText = "Digite uma dúvida antes de enviar.";
        mensagem.style.color = "#b91c1c";
        return;
      }

      socket.emit("novaPergunta", {
        alunoId: alunoId,
        codigo: codigo,
        nome: nome === "" ? "Anônimo" : nome,
        texto: pergunta
      });
    }

    document.getElementById("pergunta").addEventListener("keydown", function (evento) {
      if (evento.key === "Enter" && evento.ctrlKey) {
        enviarPergunta();
      }
    });

    socket.on("perguntaEnviada", (dados) => {
      const pergunta = document.getElementById("pergunta");
      const mensagem = document.getElementById("mensagem");

      pergunta.value = "";
      mensagem.innerText = dados.mensagem;
      mensagem.style.color = "#15803d";
    });

    socket.on("aguardeEnvio", (dados) => {
      const mensagem = document.getElementById("mensagem");
      mensagem.innerText = dados.mensagem;
      mensagem.style.color = "#b91c1c";
    });

    socket.on("erroAluno", (dados) => {
      const mensagem = document.getElementById("mensagem");
      mensagem.innerText = dados.mensagem;
      mensagem.style.color = "#b91c1c";
    });

    socket.on("aulaEncerrada", (dados) => {
      const mensagem = document.getElementById("mensagem");
      mensagem.innerText = dados.mensagem;
      mensagem.style.color = "#b91c1c";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
</html>
