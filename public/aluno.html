<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aluno - Dúvidas CESURG</title>

  <link rel="stylesheet" href="/style.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b6b3a" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dúvidas CESURG" />
  <link rel="apple-touch-icon" href="/logo-cesurg.png" />
</head>
<body>
  <div class="fundo"></div>

  <main class="container">
    <section class="card">
      <div class="topo-logo">
        <img src="/logo-cesurg.png" alt="Logo CESURG" class="logo" />
      </div>

      <h1>Enviar dúvida</h1>

      <p class="descricao">
        Digite o código da aula e envie sua dúvida para o professor.
        Você pode colocar seu nome ou enviar como anônimo.
      </p>

      <label for="codigo">Código da aula</label>
      <input
        type="text"
        id="codigo"
        placeholder="Digite o código da aula"
        autocomplete="off"
      />

      <label for="nome">Nome do aluno</label>
      <input
        type="text"
        id="nome"
        placeholder="Opcional"
        autocomplete="off"
      />

      <label for="pergunta">Sua dúvida</label>
      <textarea
        id="pergunta"
        rows="5"
        placeholder="Digite sua dúvida aqui"
      ></textarea>

      <button id="botaoEnviar" class="botao-principal">
        Enviar dúvida
      </button>

      <p id="mensagem" class="mensagem"></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const campoCodigo = document.getElementById("codigo");
    const campoNome = document.getElementById("nome");
    const campoPergunta = document.getElementById("pergunta");
    const botaoEnviar = document.getElementById("botaoEnviar");
    const mensagem = document.getElementById("mensagem");

    let alunoId = localStorage.getItem("alunoIdDuvidasCesurg");

    if (!alunoId) {
      alunoId = "aluno-" + Date.now() + "-" + Math.floor(Math.random() * 100000);
      localStorage.setItem("alunoIdDuvidasCesurg", alunoId);
    }

    const parametros = new URLSearchParams(window.location.search);
    const codigoUrl = parametros.get("codigo");

    if (codigoUrl) {
      campoCodigo.value = codigoUrl.toUpperCase();
    }

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
    }

    function enviarPergunta() {
      const codigo = campoCodigo.value.trim().toUpperCase();
      const nome = campoNome.value.trim();
      const texto = campoPergunta.value.trim();

      if (codigo === "") {
        mostrarMensagem("Digite o código da aula.", "erro");
        return;
      }

      if (texto === "") {
        mostrarMensagem("Digite sua dúvida antes de enviar.", "erro");
        return;
      }

      socket.emit("novaPergunta", {
        codigo: codigo,
        nome: nome,
        texto: texto,
        alunoId: alunoId
      });
    }

    botaoEnviar.addEventListener("click", enviarPergunta);

    campoPergunta.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter" && evento.ctrlKey) {
        enviarPergunta();
      }
    });

    socket.on("perguntaEnviada", function (dados) {
      campoPergunta.value = "";
      mostrarMensagem(dados.mensagem, "sucesso");
    });

    socket.on("erroAluno", function (dados) {
      mostrarMensagem(dados.mensagem, "erro");
    });

    socket.on("aguardeEnvio", function (dados) {
      mostrarMensagem(dados.mensagem, "erro");
    });

    socket.on("aulaEncerrada", function (dados) {
      mostrarMensagem(dados.mensagem, "erro");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
</html>
