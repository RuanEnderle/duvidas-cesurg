<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Professor - Dúvidas CESURG</title>

  <link rel="stylesheet" href="/style.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b6b3a" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dúvidas CESURG" />
  <link rel="apple-touch-icon" href="/logo-cesurg.png" />
</head>
<body>
  <div class="fundo"></div>

  <main class="container professor-container">
    <section id="areaEntrada" class="card">
      <div class="topo-logo">
        <img src="/logo-cesurg.png" alt="Logo CESURG" class="logo" />
      </div>

      <h1>Painel do professor</h1>

      <p class="descricao">
        Crie uma aula para receber dúvidas em tempo real ou entre em uma aula já criada.
      </p>

      <div class="divisor">
        <span>Criar nova aula</span>
      </div>

      <label for="professor">Nome do professor</label>
      <input
        type="text"
        id="professor"
        placeholder="Digite o nome do professor"
        autocomplete="off"
      />

      <label for="materia">Matéria ou aula</label>
      <input
        type="text"
        id="materia"
        placeholder="Digite a matéria ou aula"
        autocomplete="off"
      />

      <label for="turma">Turma ou curso</label>
      <input
        type="text"
        id="turma"
        placeholder="Digite a turma ou curso"
        autocomplete="off"
      />

      <label for="senhaCriar">Senha do professor</label>
      <input
        type="password"
        id="senhaCriar"
        placeholder="Digite uma senha para esta aula"
        autocomplete="off"
      />

      <button id="botaoCriar" class="botao-principal">
        Criar aula
      </button>

      <div class="divisor">
        <span>Entrar em aula criada</span>
      </div>

      <label for="codigoEntrar">Código da aula</label>
      <input
        type="text"
        id="codigoEntrar"
        placeholder="Digite o código da aula"
        autocomplete="off"
      />

      <label for="senhaEntrar">Senha do professor</label>
      <input
        type="password"
        id="senhaEntrar"
        placeholder="Digite a senha da aula"
        autocomplete="off"
      />

      <button id="botaoEntrar" class="botao-secundario">
        Entrar no painel
      </button>

      <p id="mensagemProfessor" class="mensagem"></p>
    </section>

    <section id="areaPainel" class="card painel oculto">
      <div class="topo-logo">
        <img src="/logo-cesurg.png" alt="Logo CESURG" class="logo" />
      </div>

      <h1>Dúvidas recebidas</h1>

      <div class="info-aula">
        <p><strong>Código da aula:</strong></p>
        <div class="codigo-box" id="codigoAula">---</div>

        <p id="infoProfessor"></p>
        <p id="infoMateria"></p>
        <p id="infoTurma"></p>
      </div>

      <div class="area-link">
        <label>Link para os alunos</label>

        <input id="linkAluno" type="text" readonly />

        <button id="botaoCopiar" class="botao-secundario">
          Copiar link
        </button>
      </div>

      <div class="area-qr">
        <p>QR Code para os alunos acessarem:</p>
        <img id="qrCode" alt="QR Code da aula" />
      </div>

      <div class="botoes-painel">
        <button id="botaoSom" class="botao-secundario">
          Ativar som
        </button>

        <button id="botaoEncerrar" class="botao-perigo">
          Encerrar aula
        </button>
      </div>

      <p id="statusSom" class="mensagem"></p>

      <div class="lista-topo">
        <h2>Perguntas pendentes</h2>
        <span id="contadorPerguntas">0</span>
      </div>

      <div id="listaPerguntas" class="lista-perguntas">
        <p class="sem-perguntas">Nenhuma dúvida enviada ainda.</p>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const areaEntrada = document.getElementById("areaEntrada");
    const areaPainel = document.getElementById("areaPainel");

    const campoProfessor = document.getElementById("professor");
    const campoMateria = document.getElementById("materia");
    const campoTurma = document.getElementById("turma");
    const campoSenhaCriar = document.getElementById("senhaCriar");

    const campoCodigoEntrar = document.getElementById("codigoEntrar");
    const campoSenhaEntrar = document.getElementById("senhaEntrar");

    const botaoCriar = document.getElementById("botaoCriar");
    const botaoEntrar = document.getElementById("botaoEntrar");

    const mensagemProfessor = document.getElementById("mensagemProfessor");

    const codigoAula = document.getElementById("codigoAula");
    const infoProfessor = document.getElementById("infoProfessor");
    const infoMateria = document.getElementById("infoMateria");
    const infoTurma = document.getElementById("infoTurma");

    const linkAluno = document.getElementById("linkAluno");
    const botaoCopiar = document.getElementById("botaoCopiar");
    const qrCode = document.getElementById("qrCode");

    const botaoSom = document.getElementById("botaoSom");
    const botaoEncerrar = document.getElementById("botaoEncerrar");
    const statusSom = document.getElementById("statusSom");

    const listaPerguntas = document.getElementById("listaPerguntas");
    const contadorPerguntas = document.getElementById("contadorPerguntas");

    let codigoAtual = "";
    let audioContexto = null;
    let somAtivado = false;

    function mostrarMensagem(texto, tipo) {
      mensagemProfessor.textContent = texto;
      mensagemProfessor.className = "mensagem " + tipo;
    }

    function mostrarStatusSom(texto, tipo) {
      statusSom.textContent = texto;
      statusSom.className = "mensagem " + tipo;
    }

    function criarAula() {
      const professor = campoProfessor.value.trim();
      const materia = campoMateria.value.trim();
      const turma = campoTurma.value.trim();
      const senha = campoSenhaCriar.value.trim();

      socket.emit("criarAula", {
        professor: professor,
        materia: materia,
        turma: turma,
        senha: senha
      });
    }

    function entrarPainelProfessor() {
      const codigo = campoCodigoEntrar.value.trim().toUpperCase();
      const senha = campoSenhaEntrar.value.trim();

      socket.emit("entrarPainelProfessor", {
        codigo: codigo,
        senha: senha
      });
    }

    botaoCriar.addEventListener("click", criarAula);
    botaoEntrar.addEventListener("click", entrarPainelProfessor);

    campoSenhaCriar.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") {
        criarAula();
      }
    });

    campoSenhaEntrar.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") {
        entrarPainelProfessor();
      }
    });

    socket.on("erroProfessor", function (dados) {
      mostrarMensagem(dados.mensagem, "erro");
    });

    socket.on("aulaCriada", function (dados) {
      codigoAtual = dados.codigo;

      areaEntrada.classList.add("oculto");
      areaPainel.classList.remove("oculto");

      codigoAula.textContent = dados.codigo;
      infoProfessor.innerHTML = "<strong>Professor:</strong> " + dados.professor;
      infoMateria.innerHTML = "<strong>Matéria:</strong> " + dados.materia;
      infoTurma.innerHTML = "<strong>Turma:</strong> " + dados.turma;

      const link = window.location.origin + "/aluno.html?codigo=" + encodeURIComponent(dados.codigo);

      linkAluno.value = link;
      qrCode.src = "/qrcode?texto=" + encodeURIComponent(link);
    });

    socket.on("listaPerguntas", function (perguntas) {
      renderizarPerguntas(perguntas);
    });

    function renderizarPerguntas(perguntas) {
      contadorPerguntas.textContent = perguntas.length;

      if (perguntas.length === 0) {
        listaPerguntas.innerHTML = '<p class="sem-perguntas">Nenhuma dúvida enviada ainda.</p>';
        return;
      }

      listaPerguntas.innerHTML = "";

      perguntas.forEach(function (pergunta) {
        const item = document.createElement("div");
        item.className = "pergunta-card";

        const topo = document.createElement("div");
        topo.className = "pergunta-topo";

        const nome = document.createElement("strong");
        nome.textContent = pergunta.nome || "Anônimo";

        const horario = document.createElement("span");
        horario.textContent = pergunta.horario || "";

        topo.appendChild(nome);
        topo.appendChild(horario);

        const texto = document.createElement("p");
        texto.textContent = pergunta.texto;

        const botao = document.createElement("button");
        botao.className = "botao-responder";
        botao.textContent = "Marcar como respondida";

        botao.addEventListener("click", function () {
          socket.emit("marcarRespondida", {
            codigo: codigoAtual,
            id: pergunta.id
          });
        });

        item.appendChild(topo);
        item.appendChild(texto);
        item.appendChild(botao);

        listaPerguntas.appendChild(item);
      });
    }

    botaoCopiar.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(linkAluno.value);
        botaoCopiar.textContent = "Link copiado!";

        setTimeout(function () {
          botaoCopiar.textContent = "Copiar link";
        }, 2000);
      } catch (erro) {
        linkAluno.select();
        document.execCommand("copy");
      }
    });

    botaoSom.addEventListener("click", function () {
      if (!audioContexto) {
        audioContexto = new (window.AudioContext || window.webkitAudioContext)();
      }

      somAtivado = true;
      tocarSom();

      botaoSom.textContent = "Som ativado";
      mostrarStatusSom("Som ativado. O professor será avisado quando chegar uma nova dúvida.", "sucesso");
    });

    function tocarSom() {
      if (!somAtivado || !audioContexto) {
        return;
      }

      const oscilador = audioContexto.createOscillator();
      const ganho = audioContexto.createGain();

      oscilador.type = "sine";
      oscilador.frequency.setValueAtTime(880, audioContexto.currentTime);

      ganho.gain.setValueAtTime(0.001, audioContexto.currentTime);
      ganho.gain.exponentialRampToValueAtTime(0.7, audioContexto.currentTime + 0.02);
      ganho.gain.exponentialRampToValueAtTime(0.001, audioContexto.currentTime + 0.35);

      oscilador.connect(ganho);
      ganho.connect(audioContexto.destination);

      oscilador.start();
      oscilador.stop(audioContexto.currentTime + 0.35);
    }

    socket.on("notificacaoProfessor", function () {
      tocarSom();
    });

    botaoEncerrar.addEventListener("click", function () {
      const confirmar = confirm("Tem certeza que deseja encerrar esta aula? O código não poderá mais ser usado.");

      if (!confirmar) {
        return;
      }

      socket.emit("encerrarAula", {
        codigo: codigoAtual
      });
    });

    socket.on("aulaEncerrada", function (dados) {
      alert(dados.mensagem);

      codigoAtual = "";

      areaPainel.classList.add("oculto");
      areaEntrada.classList.remove("oculto");

      campoCodigoEntrar.value = "";
      campoSenhaEntrar.value = "";

      listaPerguntas.innerHTML = '<p class="sem-perguntas">Nenhuma dúvida enviada ainda.</p>';
      contadorPerguntas.textContent = "0";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
</html>
